syntax = "proto3";

package panko.bot.v1;

import "google/protobuf/timestamp.proto";
import "bot/v1/world.proto";

option go_package = "panko/api/gen/bot/v1;botv1";

// BotService 暴露单个机器人的控制接口。
service BotService {
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  rpc Say(SayRequest) returns (SayResponse);
  rpc RunCommand(RunCommandRequest) returns (RunCommandResponse);
  rpc PlaceBlocks(PlaceBlocksRequest) returns (PlaceBlocksResponse);
}

enum BotState {
  BOT_STATE_UNSPECIFIED = 0;
  BOT_STATE_OFFLINE = 1;
  BOT_STATE_CONNECTING = 2;
  BOT_STATE_ONLINE = 3;
}

message BotStatus {
  BotState state = 1;
  string player_name = 2;
  string server_address = 3;
  string protocol_version = 4;
  google.protobuf.Timestamp online_since = 5;
}

message GetStatusRequest {}

message GetStatusResponse {
  BotStatus status = 1;
}

message SayRequest {
  string text = 1;
  // 由调用方生成，重试时保持不变，用于去重。
  string request_id = 2;
}

message SayResponse {
  string request_id = 1;
}

message RunCommandRequest {
  string command = 1;
  string request_id = 2;
}

message RunCommandResponse {
  string request_id = 1;
  int32 status_code = 2;
  string output = 3;
}

message PlaceBlocksRequest {
  repeated BlockPlacement blocks = 1;
  string request_id = 2;
}

message PlaceBlocksResponse {
  string request_id = 1;
  int32 accepted = 2;
  int32 rejected = 3;
}
