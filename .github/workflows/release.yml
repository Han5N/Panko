name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build (windows-amd64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: go.mod

      - name: 计算版本
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: 构建 hub
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=$VERSION" \
            -o panko-hub-windows-amd64.exe ./hub/cmd/hub

      - name: 构建 botd
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          cmake -S core -B build -A x64 -DPANKO_VERSION="$VERSION"
          cmake --build build --config Release
          cp build/Release/botd.exe panko-botd-windows-amd64.exe

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: |
            panko-hub-windows-amd64.exe
            panko-botd-windows-amd64.exe
          if-no-files-found: error

  release:
    name: 创建预发布
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Panko $GITHUB_REF_NAME" \
            --prerelease \
            --latest=false \
            --generate-notes
