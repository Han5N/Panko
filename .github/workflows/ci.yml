name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hub:
    name: hub
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o hub-bin.exe ./hub/cmd/hub

  core:
    name: core
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 配置
        run: cmake -S core -B build -A x64
      - name: 构建
        run: cmake --build build --config Release
      - name: 测试
        run: ctest --test-dir build -C Release --output-on-failure
